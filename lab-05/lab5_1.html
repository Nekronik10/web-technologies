<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="color-div">
        <h1>План подорожі:</h1>

        <ul class="list-level1">
            <li>
                <span>Підготовчий етап</span>
                <ul class="list-level2">
                    <li class="phone"><span>Обрати маршрут</span></li>
                    <li class="ticket"><span>Квитки на літак</span></li>
                    <li class="hotel"><span>Готель</span></li>
                    <li class="car"><span>Оренда авто</span></li>
                </ul>
            </li>

            <li>
                <span>Відпочинок</span>
                <ul class="list-level2">
                    <li class="bar"><span>Бари</span></li>
                    <li class="casino"><span>Казино</span></li>
                    <li class="museum"><span>Музеї</span></li>
                    <li class="festival"><span>Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
