<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trip-div">
        <h1 class="trip-title">План подорожі:</h1>

        <ul class="travel-list">
            <li class="travel-item">
                <span class="stages-item">Підготовчий етап</span>
                <ul class="stages-list">
                    <li class="phone"><span>Обрати маршрут</span></li>
                    <li class="ticket"><span>Квитки на літак</span></li>
                    <li class="hotel"><span>Готель</span></li>
                    <li class="car"><span>Оренда авто</span></li>
                </ul>
            </li>

            <li class="travel-item">
                <span class="stages-item">Відпочинок</span>
                <ul class="stages-list">
                    <li class="bar"><span>Бари</span></li>
                    <li class="casino"><span>Казино</span></li>
                    <li class="museum"><span>Музеї</span></li>
                    <li class="festival"><span>Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
