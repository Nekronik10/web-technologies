<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="trip-div">
        <h1 class="trip-title">План подорожі:</h1>

        <ul class="travel-list">
            <li class="travel-item">
                <span class="stages-item">Підготовчий етап</span>
                <ul class="stages-list">
                    <li class="icon-phone"><span>Обрати маршрут</span></li>
                    <li class="icon-ticket"><span>Квитки на літак</span></li>
                    <li class="icon-hotel"><span>Готель</span></li>
                    <li class="icon-car"><span>Оренда авто</span></li>
                </ul>
            </li>

            <li class="travel-item">
                <span class="stages-item">Відпочинок</span>
                <ul class="stages-list">
                    <li class="icon-bar"><span>Бари</span></li>
                    <li class="icon-casino"><span>Казино</span></li>
                    <li class="icon-museum"><span>Музеї</span></li>
                    <li class="icon-festival"><span>Фестивалі</span></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
