<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table 2</title>
</head>
<body>

<table border="2" align="center">

    <tr style="height: 52px;">
        <td colspan="2"></td>
        <td colspan="3"></td>
        <td colspan="2" style="background-color: #fffa69;"></td>
    </tr>

    <tr>
        <td rowspan="2" style="width: 70px; height: 40px;"></td>
        <td colspan="4" rowspan="4" style="background-color: #ff5b2d;"></td>
        <td colspan="2" rowspan="2" style="background-color: #fffa69;"></td>
    </tr>

    <tr style="height: 70px;">
    </tr>

    <tr style="height: 70px;">
        <td rowspan="3" style="width: 70px;"></td>
        <td rowspan="2" style="width: 70px;"></td>
        <td rowspan="2" style="width: 70px;"></td>
    </tr>

    <tr style="height: 40px;">
    </tr>

    <tr style="height: 40px;">
        <td rowspan="2" colspan="2" style="width: 70px; background-color: #000000;"></td>
        <td rowspan="2" style="width: 70px; background-color: #000000;"></td>
        <td colspan="2"></td>
        <td colspan="2"></td>
    </tr>

    <tr style="height: 40px;">
        <td rowspan="3" style="background-color: #fffa69;"></td>
        <td colspan="2"></td>
        <td colspan="2" rowspan="2" style="background-color: #074481;"></td>
    </tr>

    <tr style="height: 40px;">
        <td colspan="2" rowspan="2"></td>
        <td colspan="2" style="width: 70px; background-color: #000000;"></td>
    </tr>

    <tr style="height: 35px;">
        <td colspan="4"></td>
    </tr>

</table>

<a href="/lab-03/index.html">Вернутись назад</a>
</body>
</html>
