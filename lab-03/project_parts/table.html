<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>

  <table border="2" align="center">

    <tr>
        <td colspan="8" style="height: 70px; background-color: #7dfad0;"></td>
    </tr>

    <tr>
        <td rowspan="6" style="width: 70px; height: 70px; background-color: #fffbd6;"></td>
        <td colspan="6" style="height: 70px; background-color: #7dfad0;"></td>
        <td rowspan="6" style="width: 70px; background-color: #fffbd6;"></td>
    </tr>

    <tr>
        <td rowspan="4" style="width: 70px; height: 70px; background-color: #fffbd6;"></td>
        <td colspan="4" style="height: 70px; background-color: #7dfad0;"></td>
        <td rowspan="4" style="width: 70px; background-color: #fffbd6;"></td>
    </tr>

    <tr>
        <td rowspan="2" style="width: 70px; height: 70px; background-color: #fffbd6;"></td>
        <td style="width: 70px; height: 70px; background-color: red;"></td>
        <td style="width: 70px; height: 70px; background-color: blue;"></td>
        <td rowspan="2" style="width: 70px; background-color: #fffbd6;"></td>
    </tr>

    <tr>
        <td style="width: 70px; height: 70px; background-color: #7cf94f;"></td>
        <td style="width: 70px; height: 70px; background-color: #fffa69;"></td>
    </tr>

    <tr>
        <td colspan="4" style="height: 70px; background-color: #7dfad0;"></td>
    </tr>

    <tr>
        <td colspan="6" style="height: 70px; background-color: #7dfad0;"></td>
    </tr>

    <tr>
        <td colspan="8" style="height: 70px; background-color: #7dfad0;"></td>
    </tr>

</table>

<a href="/lab-03/index.html">Вернутись назад</a>

</body>
</html>
