<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Popup</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="style6.css">
</head>
<body>
  <div class="header">
    <a class="header-link" href="#">Mail</a>
    <a class="header-link" href="#">Images</a>

    <div class="popup-wrap">
      <button class="popup-button material-icons" type="button">apps</button>

      <div class="popup" tabindex="0">
        <div class="popup-grid">
          <a class="item" href="#"><span class="item-icon material-icons">calendar_month</span>Calendar</a>
          <a class="item" href="#"><span class="item-icon material-icons">mail</span>Mail</a>
          <a class="item" href="#"><span class="item-icon material-icons">newspaper</span>News</a>
          <a class="item" href="#"><span class="item-icon material-icons">map</span>Map</a>
          <a class="item" href="#"><span class="item-icon material-icons">folder</span>Files</a>
          <a class="item" href="#"><span class="item-icon material-icons">contacts</span>Contacts</a>
        </div>

        <div class="more">
          <input class="more-checkbox" id="more-toggle" type="checkbox" aria-label="More">
          <label class="more-button" for="more-toggle">More</label>

          <div class="popup-extra">
            <a class="item" href="#"><span class="item-icon material-icons">photo_camera</span>Photos</a>
            <a class="item" href="#"><span class="item-icon material-icons">apps</span>Apps</a>
            <a class="item" href="#"><span class="item-icon material-icons">description</span>Documents</a>
            <a class="item" href="#"><span class="item-icon material-icons">chat</span>Chat</a>
            <a class="item" href="#"><span class="item-icon material-icons">school</span>Classroom</a>
            <a class="item" href="#"><span class="item-icon material-icons">bookmark</span>Collection</a>
          </div>
        </div>
      </div>
    </div>

    <a class="header-link material-icons" href="#">notifications</a>
    <a class="header-link avatar material-icons" href="#">account_circle</a>
  </div>
</body>
</html>
