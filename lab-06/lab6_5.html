<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <link rel="stylesheet" href="style5.css">
</head>
<body>
  <div class="frame">
    <div class="card"></div>

    <div class="arrows">
      <span><i class="material-icons">arrow_back</i></span>
      <span><i class="material-icons">arrow_forward</i></span>
    </div>

    <div class="cloud"></div>
    <div class="smoke"></div>

    <div class="temp">17</div>

    <ul class="forecast">
      <li><span class="day">Mon</span><span class="deg">17°</span></li>
      <li><span class="day">Tue</span><span class="deg">19°</span></li>
      <li><span class="day">Wed</span><span class="deg">16°</span></li>
      <li><span class="day">Thu</span><span class="deg">18°</span></li>
      <li><span class="day">Fri</span><span class="deg">21°</span></li>
    </ul>
  </div>
</body>
</html>
